<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clarissa Telur 🥚</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- HERO -->
  <header class="hero">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="hero-inner">
      <div class="tag">🛒 Warung Sembako Lengkap</div>
      <h1>Clarissa<span>Telur</span></h1>
      <p class="sub">Kebutuhan dapur lengkap, harga jujur.</p>
      <div class="pay-pills">
        <span>💵 Cash</span><span>🏦 Transfer</span><span>📱 QRIS</span>
      </div>
    </div>
  </header>

  <!-- SEARCH -->
  <div class="search-wrap">
    <div class="search-box">
      <span class="si">🔍</span>
      <input id="srch" type="text" placeholder="Cari produk... mis: royko, indomie, beras" oninput="doSearch()"/>
    </div>
  </div>

  <!-- MAIN -->
  <main class="main">
    <div class="cat-row" id="catRow"></div>
    <div id="content"></div>
    <div class="no-res" id="noRes">Produk tidak ditemukan 😕</div>
  </main>

  <!-- FAB -->
  <button class="fab" onclick="openDrw()">
    🛒 Keranjang <span class="fab-n" id="fabN">0</span>
  </button>

  <!-- OVERLAY -->
  <div class="ovl" id="ovl" onclick="closeDrw()"></div>

  <!-- DRAWER -->
  <aside class="drw" id="drw">
    <div class="dh">
      <span class="dh-t">Keranjang Belanja 🛒</span>
      <button class="btn-x" onclick="closeDrw()">✕</button>
    </div>
    <div class="dlist" id="dlist">
      <div class="dempty">🧺<br/>Keranjang masih kosong</div>
    </div>
    <div class="dfoot" id="dfoot" style="display:none">
      <div class="fg">
        <label>Nama kamu *</label>
        <input id="fNama" type="text" placeholder="mis: Kak Rini"/>
      </div>
      <div class="fg">
        <label>Metode Pembayaran</label>
        <div class="rrow" id="rrow">
          <label class="rb sel"><input type="radio" name="bayar" value="Cash" checked/> 💵 Cash</label>
          <label class="rb"><input type="radio" name="bayar" value="Transfer"/> 🏦 Transfer</label>
          <label class="rb"><input type="radio" name="bayar" value="QRIS"/> 📱 QRIS</label>
        </div>
      </div>
      <div class="fg">
        <label>Alamat (opsional)</label>
        <input id="fAlamat" type="text" placeholder="Jl. Melati No. 5..."/>
      </div>
      <div class="fg">
        <label>Notes / Catatan</label>
        <textarea id="fNotes" placeholder="mis: telurnya yg besar ya kak, royko sapi ada gak?"></textarea>
      </div>
      <button class="btn-wa" onclick="kirimWA()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        Pesan via WhatsApp
      </button>
    </div>
  </aside>

  <footer class="footer">
    <strong>Clarissa Telur 🥚</strong>
    <p>Cash · Transfer · QRIS &nbsp;·&nbsp; Silakan tanyakan barang yang kamu cari!</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
